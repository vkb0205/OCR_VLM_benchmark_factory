<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box }
    body { margin: 0; font-family: "Factory Serif", serif; font-size: 10pt; line-height: 1.4; color: #171717 }
    header { position: absolute; top: 12mm; left: 18mm; right: 18mm; font-size: 8pt }
    footer { position: absolute; bottom: 12mm; left: 18mm; right: 18mm; font-size: 8pt }
    main { position: absolute; top: 30mm; bottom: 26mm; left: 18mm; right: 18mm }
    p { margin: 0 0 2mm }
    table { width: 100%; border-collapse: collapse }
    td, th { padding: 3px; border-bottom: 1px solid #777 }
    h1 { font-size: 16pt }
    h2 { font-size: 12pt }
  </style>
</head>
<body>
  <section class="page" data-page-role="title_page" data-size="a4" data-ro-level="L0">
    <header data-slot="journal" data-continued></header>
    <main data-region="body" data-chain="1">
      <div data-slot="title" data-split="auto"></div>
      <div data-slot="authors" data-split="auto"></div>
      <div data-slot="affiliations" data-split="auto"></div>
      <div data-slot="abstract" data-split="auto"></div>
      <div data-slot="abstract_alt" data-split="auto"></div>
      <div data-slot="keywords" data-split="auto"></div>
      <div data-slot="keywords_alt" data-split="auto"></div>
    </main>
    <footer data-label="page_number" data-continued>{n} / {total}</footer>
  </section>
  <section class="page" data-page-role="body" data-size="a4" data-ro-level="L0">
    <header data-label="header" data-continued>BÀI BÁO NGHIÊN CỨU</header>
    <main data-region="body" data-chain="1">
      <div data-slot="body" data-split="auto"></div>
    </main>
    <footer data-label="page_number" data-continued>{n} / {total}</footer>
  </section>
  <section class="page" data-page-role="references" data-size="a4" data-ro-level="L0">
    <header data-label="header" data-continued>BÀI BÁO NGHIÊN CỨU</header>
    <main data-region="body" data-chain="1">
      <div data-slot="references" data-split="auto"></div>
    </main>
    <footer data-label="page_number" data-continued>{n} / {total}</footer>
  </section>
  <section class="page" data-page-role="appendix" data-size="a4" data-ro-level="L0">
    <header data-label="header" data-continued>BÀI BÁO NGHIÊN CỨU</header>
    <main data-region="body" data-chain="1">
      <div data-slot="acknowledgement" data-split="auto"></div>
    </main>
    <footer data-label="page_number" data-continued>{n} / {total}</footer>
  </section>
</body>
</html>
