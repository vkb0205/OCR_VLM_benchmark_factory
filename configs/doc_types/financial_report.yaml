lang:
  vi:
    fields:
    - cat: header
      guide: company name + report period, may be 2 lines
      id: running_header
      kind: text
    - cat: footer
      guide: statement that the notes are an integral part of the report
      id: running_footer
      kind: text
    - cat: figure
      guide: fictional logo
      id: cover_logo
      kind: figure
      section: cover
    - cat: title
      guide: full fictional company name in upper case, e.g. CÔNG TY CỔ PHẦN ...
      id: cover_company
      kind: text
      section: cover
    - cat: text_block
      guide: Cho năm tài chính kết thúc ngày 31/12/<year>
      id: cover_period
      kind: text
      section: cover
    - cat: text_block
      guide: fictional address, no real street numbers
      id: cover_address
      kind: text
      section: cover
    - cat: text_block
      guide: 'Mã số thuế: 10 digits starting 0000'
      id: cover_tax
      kind: text
      section: cover
    - cat: section_header
      guide: BÁO CÁO CỦA BAN TỔNG GIÁM ĐỐC
      id: board_title
      kind: text
      section: board_report
    - cat: text_block
      guide: '60-120 words each: company overview, activities, results of the year, financial position,
        outlook, board members, auditor, board responsibility and events after the period'
      id: board_paragraph
      kind: text
      many:
      - 6
      - 10
      section: board_report
    - cat: caption_table
      guide: caption for the board member table
      id: directors_caption
      kind: text
      parent: directors_table
      section: board_report
    - cat: table
      guide: header [Họ và tên, Chức vụ, Ngày bổ nhiệm]; 4-7 fictional members
      id: directors_table
      kind: table
      section: board_report
    - cat: chart
      guide: revenue and profit after tax (optionally total assets as a third series) for 4-5 years, in
        tỷ đồng; last year = statement figures
      id: revenue_chart
      kind: chart
      section: board_report
    - cat: caption_chart
      guide: Biểu đồ 1. ...
      id: revenue_chart_caption
      kind: text
      parent: revenue_chart
      section: board_report
    - cat: text_block
      guide: Tại ngày 31 tháng 12 năm <year>
      id: B01_date
      kind: text
      section: B01
    - cat: table
      columns:
      - Chỉ tiêu
      - Mã số
      - Thuyết minh
      - Số cuối năm
      - Số đầu năm
      guide: choose 35-55 leaf lines plausible for the industry; integer VND, scaled to company size
      id: B01_table
      kind: statement
      lines: B01
      section: B01
    - cat: text_block
      guide: Cho năm tài chính kết thúc ngày 31/12/<year>
      id: B02_date
      kind: text
      section: B02
    - cat: table
      columns:
      - Chỉ tiêu
      - Mã số
      - Thuyết minh
      - Năm nay
      - Năm trước
      guide: every line; expenses positive; EPS (70) in VND per share
      id: B02_table
      kind: statement
      lines: B02
      section: B02
    - cat: text_block
      guide: <city>, ngày dd tháng 03 năm <year+1>
      id: signature_date
      kind: text
      section: signature
    - cat: signature
      id: signature_1
      kind: signature
      section: signature
    - cat: text_block
      guide: fictional Vietnamese full name
      id: signer_1_name
      kind: text
      section: signature
    - cat: signature
      id: signature_2
      kind: signature
      section: signature
    - cat: text_block
      guide: fictional Vietnamese full name
      id: signer_2_name
      kind: text
      section: signature
    - cat: signature
      id: signature_3
      kind: signature
      section: signature
    - cat: seal
      guide: 'seal ring text: short company name in upper case, max 34 characters'
      id: company_seal
      kind: seal
      section: signature
    - cat: text_block
      guide: fictional Vietnamese full name
      id: signer_3_name
      kind: text
      section: signature
    - cat: title
      guide: BÁO CÁO KIỂM TOÁN ĐỘC LẬP
      id: auditor_title
      kind: text
      section: auditor_report
    - cat: text_block
      guide: Kính gửi cổ đông và Hội đồng quản trị
      id: auditor_addressee
      kind: text
      section: auditor_report
    - cat: text_block
      guide: '5–9 paragraphs, 65–100 Vietnamese words each: scope, management responsibility, auditor
        responsibility, audit basis, unmodified opinion. Fictional audit only.'
      id: auditor_paragraphs
      kind: text
      many:
      - 5
      - 9
      section: auditor_report
    - cat: section_header
      guide: Fictional auditing firm name
      id: auditor_firm
      kind: text
      section: auditor_report
    - cat: signature
      id: auditor_signature
      kind: signature
      section: auditor_report
    - cat: seal
      id: auditor_seal
      kind: seal
      section: auditor_report
    - cat: text_block
      guide: Fictional place and audit date
      id: auditor_date
      kind: text
      section: auditor_report
    - cat: text_block
      guide: For fiscal year ended 31 December
      id: B03_date
      kind: text
      section: B03
    - cat: table
      columns:
      - CHỈ TIÊU
      - Mã số
      - Thuyết minh
      - Năm nay
      - Năm trước
      guide: Opening cash (code 60) current must equal B01 code 110 prior; closing cash (code 70) must
        equal B01 code 110 in each period. Preserve earlier opening cash for the prior year. Use realistic
        receipts (line 16 nonnegative) and payments (line 17 nonpositive), so code-owned cash ties require
        only small adjustments.
      id: B03_table
      kind: statement
      lines: B03
      section: B03
    - cat: text_block
      guide: 8–14 numbered B09-DN note sections; each title and 1–3 paragraphs of 60–90 words. The report
        is table-heavy - almost every section has a table (4–8 rows, 3–5 columns, different shapes), and
        4–6 sections also have a chart (mix bar, line and donut; 3–6 labels, 1–3 series, caption "Biểu
        đồ N. ..."). Include policies, cash, receivables, inventory, fixed assets, debt, equity, revenue,
        tax.
      id: notes
      kind: notes
      section: notes
    - cat: text_block
      guide: '4–6 metrics: label, value (integer VND), unit, source (B02.10 revenue, B02.60 profit after
        tax, B01.270 assets, B01.400 equity). Values recomputed by code.'
      id: kpis
      kind: kpis
      section: board_report
