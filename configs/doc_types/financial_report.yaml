prompt: 'Audited Vietnamese financial statements (TT200) for a {{ company_size }} company in
  {{ industry }}, fiscal year {{ fiscal_year }} (prior year {{ fiscal_year - 1 }}).

  Total assets (line 270) MUST be {% if company_size == "small" %}20-150{% elif company_size == "medium" %}150-1,500{% else %}1,500-30,000{% endif %}
  billion VND, and lines should not be round numbers (e.g. 47,318,265,400 rather than 47,000,000,000).

  The note of a statement row is the number of its note (e.g. "5" or "5.2") or empty.

  Write only leaf statement lines; totals are recomputed. Contra lines (*) are negative. Keep chart revenue
  and profit consistent with the statements, rounded to tỷ đồng.

  The company, people and places are invented, but write as a real company would: never use words such as
  fictional, illustrative, sample, synthetic or placeholder in any text.

  '
