# LLM endpoints, in priority order. An agent uses the endpoint named under
# `agents`, or else the first endpoint whose credential variable is set.
# Credentials come from the shell or from benchmark_factory/.env (KEY=VALUE).
# `api_key_env`, `base_url_env` and `model_env` name the variables holding the key,
# server URL and model name; `base_url` / `model` are the defaults when those are unset.
#
#   api: anthropic   Anthropic Messages API (official `anthropic` SDK)
#   api: openai      OpenAI or any OpenAI-compatible server (official `openai` SDK);
#                    set base_url / base_url_env for vLLM, Ollama, OpenRouter, ...
#
# `params` is passed through to the provider request unchanged.
# Force one endpoint for a run with: factory generate ... --model <name>

endpoints:
  claude:
    api: anthropic
    model: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
    base_url_env: ANTHROPIC_BASE_URL
    model_env: ANTHROPIC_MODEL
    max_tokens: 64000
    price_in: 4.0
    price_out: 20.0
    params:
      output_config: {effort: medium}
      # On a safety decline, the API reruns the request on a fallback model.
      betas: [server-side-fallback-2026-07-01]
      fallbacks: default

  openai:
    api: openai
    model: gpt-5.1
    api_key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL   # unset = api.openai.com; set it for compatible servers
    model_env: OPENAI_MODEL_NAME
    max_tokens: 24000   # normal replies are 3–10k; a runaway stops here and is retried
    json_mode: true
    params:
      reasoning_effort: low   # Chat Completions field; design calls were ~30k reasoning tokens at the default

  local:
    api: openai
    model: qwen3-32b
    api_key_env: LOCAL_LLM_API_KEY
    base_url: http://localhost:8000/v1

  luna:
    api: openai
    model: gpt-6-luna
    api_key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL
    max_tokens: 64000
    json_mode: true
    params:
      reasoning_effort: medium

# USD per million tokens [input, output], by model name. Used for trace cost_usd and wins over an
# endpoint's price_in / price_out (model_env can swap the model behind an endpoint).
# Cached replies cost 0. A model missing here logs a warning once per run.
prices:
  claude-opus-5-5: [4.0, 20.0]
  gpt-6-luna: [0.10, 0.50, 0.01]   # input, output, cached input; https://developers.openai.com/api/docs/pricing verified 2026-11-05

agents: {academic_paper: luna}
  # financial_report: claude
