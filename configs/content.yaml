field_kinds:
  article: 'Ordered list of typed elements: heading {level,text}; paragraph {text};
    list {ordered,items}; equation {id,latex,numbered}; table {id,caption,header,rows,note?,landscape?,table_style?};
    chart {id,caption,chart_type,labels,series,x_label?,y_label?,legend_position?,gridlines?};
    figure {id,figure_type,caption,description,labels?,panels?}; code {id?,caption?,language,lines};
    box {kind,title,text}. Cells may be strings or {text,colspan,rowspan,bold}.'
  authors: 'List of 1–8 objects: name, affiliations (1-based list of affiliation numbers),
    optional email, and corresponding (boolean); exactly one corresponding author.'
  chart:
    chart_type: bar|line|donut
    labels:
    - '...'
    series:
    - name: '...'
      values:
      - non-negative numbers
    unit: '...'
  figure:
    colors:
    - '#rrggbb'
    - '#rrggbb'
    description: '...'
    motif: circle|leaf|diamond|waves|blocks
  kpis: 'List of 4–6 objects: label (string), value (integer or string), unit (string),
    optional source (B01.code or B02.code or B03.code). Statement figures must carry
    source.'
  notes:
    chart: null, or an object like the chart field kind plus caption ("Biểu đồ N.
      ...")
    guide: List of 8–14 sections. Financial reports are table-heavy - give almost
      every section a table of 4–8 rows and 3–5 columns (null only for a pure policy
      section), and give 4–6 sections an extra chart.
    paragraphs:
    - 1–3 paragraphs per section
    table:
      header:
      - '...'
      rows:
      - - '...'
    title: section title
  references: 'List of 8–25 objects: text (formatted fictional reference) and cite
    (short author-year form for in-text citations). Use no real authors, journals,
    institutions or DOIs.'
  seal:
    text: max 40 characters
  signature: No agent value; generated by code
  statement:
    rows:
    - code: '111'
      note: '...'
      values:
      - integer current VND
      - integer prior VND
  table:
    header:
    - '...'
    rows:
    - - '...'
  text: 'a string; with many: [min,max], a list of strings'
repair_rounds: 3
system: >-
  You create fictional documents for an OCR and layout-analysis benchmark. Never use a real
  company, person, address, tax code, institution, journal, brand, or number as a claimed fact.
  Follow the language and register in each task. Return exactly the JSON object requested by
  the task, with no prose or Markdown outside it. Preserve all requested fields and facts.
  The documents must read as real: never write words such as fictional, illustrative, synthetic or
  placeholder in any value.
